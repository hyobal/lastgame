<!doctype html>
<html lang="en">
<head>

<title>TradeGuess — Under Maintenance</title>

body{min-height:100vh;display:grid;place-items:center;padding:24px}
main{width:min(100%,560px);text-align:center}
.brand{font-size:18px;font-weight:800;letter-spacing:.24em;color:#fff;margin-bottom:64px}
.signal{width:62px;height:62px;border:1px solid #343b4b;border-radius:18px;display:grid;place-items:center;margin:0 auto 30px;color:#8ba5cf;font-size:27px}
h1{font-size:clamp(30px,6vw,46px);line-height:1.15;letter-spacing:-.04em;margin:0 0 20px}
p{font-size:16px;line-height:1.8;color:#a3adbe;margin:0 auto;max-width:420px}
.rule{height:1px;background:#252b36;margin:48px 0 22px}
small{color:#667083;font-size:12px;letter-spacing:.13em}
</style>
</head>
<body><main>
<div class="brand">TRADEGUESS</div>
<div class="signal" aria-hidden="true">⌁</div>
<h1>Under Maintenance</h1>
<p>TradeGuess is temporarily unavailable while we perform maintenance. Thank you for your patience. Please check back later.</p>
<div class="rule"></div>
<small>TRADEGUESS · MARKET INTELLIGENCE</small>
</main></body></html>
